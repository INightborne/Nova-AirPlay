name: Experimental iPhone AirPlay receiver for Fire OS 5
on:
  push:
    paths:
      - '.github/workflows/airplay-port.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/airplay-port.yml'
jobs:
  airplay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Diagnostics
        run: |
          uname -a
          df -h
          git --version
      - name: Clone public upstream AirPlay receiver
        run: git clone --depth=1 --recurse-submodules https://github.com/prat3ik/iMirror.git receiver
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Patch Android minimum version
        working-directory: receiver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          t = p.read_text()
          assert "minSdk = 25" in t, "Upstream min SDK configuration changed"
          p.write_text(t.replace("minSdk = 25", "minSdk = 22"))
          print("Using Android API 22 minimum; runtime compatibility NOT confirmed")
          PY
      - name: Build iMirror receiver (experimental)
        working-directory: receiver
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nova-airplay-experimental-receiver-apks
          path: receiver/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
